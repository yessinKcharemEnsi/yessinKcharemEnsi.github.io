<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image source — 1200×630</title>
<style>
  /* Fixed 1200x630. Screenshot this element exactly, save as assets/og-image.png. */
  html, body { margin: 0; padding: 0; background: #333; }
  .card {
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    background: #0b0f14;
    background-image:
      linear-gradient(#131c26 1px, transparent 1px),
      linear-gradient(90deg, #131c26 1px, transparent 1px);
    background-size: 40px 40px;
    color: #dde6ef;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    padding: 84px 88px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .status { font-size: 20px; letter-spacing: .16em; text-transform: uppercase; color: #3fb950;
            margin-bottom: 34px; display: flex; align-items: center; gap: 14px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #3fb950; }
  h1 { font-size: 104px; font-weight: 600; letter-spacing: -.035em; line-height: 1; margin: 0 0 22px; color: #fff; }
  .role { font-size: 32px; color: #8496a6; margin: 0 0 54px; }
  .stats { display: flex; gap: 20px; }
  .stat { background: #121a23; border: 1px solid #223040; border-radius: 10px; padding: 22px 28px; }
  .fig { font-size: 44px; font-weight: 600; color: #58a6ff; line-height: 1; }
  .lbl { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #8496a6; margin-top: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="status"><span class="dot"></span>Available · open to EU relocation</div>
  <h1>Yessin Kcharem</h1>
  <p class="role">Backend &amp; distributed data systems · Tunis, Tunisia</p>
  <div class="stats">
    <div class="stat"><div class="fig">50%</div><div class="lbl">Response time reduced</div></div>
    <div class="stat"><div class="fig">1K/s</div><div class="lbl">Requests sustained</div></div>
    <div class="stat"><div class="fig">80%</div><div class="lbl">Test coverage held</div></div>
  </div>
</div>
</body>
</html>
