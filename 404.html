<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Yessin Kcharem</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
  .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; }
  .lost .code { font-family: var(--mono); font-size: clamp(3rem, 14vw, 6rem); font-weight: 600;
                 letter-spacing: -.04em; line-height: 1; margin: 0 0 .6rem; color: var(--accent); }
  .lost h1 { font-family: var(--mono); font-size: 1.1rem; font-weight: 600; margin: 0 0 .5rem; }
  .lost p { color: var(--text-dim); margin: 0 0 1.8rem; }
</style>
</head>
<body>
<main class="lost grid-bg">
  <div class="wrap">
    <p class="code">404</p>
    <h1>That page isn't here</h1>
    <p>The link may be out of date, or the page may have moved.</p>
    <a class="btn btn-primary" href="/">Back to the homepage</a>
  </div>
</main>
</body>
</html>
